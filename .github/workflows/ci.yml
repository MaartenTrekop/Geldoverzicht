name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test:ci

      - name: Local database API tests
        run: npm run test:api

      - name: Production build
        run: npm run build

      - name: Local database build
        run: npx ng build --configuration local-db --output-path dist/local-db

      - name: Keep the build for inspection
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/geldoverzicht/browser
          retention-days: 7
