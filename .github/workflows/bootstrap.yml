# One-off workflow: scaffolds the Angular workspace with the official CLI
# (so angular.json, tsconfigs and package-lock.json come straight from `ng new`)
# and commits the result back to main. Removed again once the app is in place.
name: bootstrap

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap.yml']

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: ng new
        env:
          CI: 'true'
          NG_CLI_ANALYTICS: 'false'
        run: |
          cd "$RUNNER_TEMP"
          {
            echo "## ng new"
            npx -y @angular/cli@latest new geldoverzicht --defaults --style=scss --ssr=false --skip-git --package-manager=npm 2>&1
            cd geldoverzicht
            echo "## ng version"
            npx ng version 2>&1
            echo "## ng build"
            npx ng build 2>&1 | tail -40
            echo "## ng test"
            npx ng test --watch=false 2>&1 | tail -60
            echo "## node_modules/.bin"
            ls node_modules/.bin | tr '\n' ' '
          } > "$RUNNER_TEMP/scaffold.log" 2>&1 || true
          cat "$RUNNER_TEMP/scaffold.log"

      - name: Commit scaffold
        run: |
          rsync -a --exclude node_modules --exclude .angular --exclude dist "$RUNNER_TEMP/geldoverzicht/" ./
          cp "$RUNNER_TEMP/scaffold.log" ./scaffold.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: scaffold Angular workspace with ng new"
          git push origin HEAD:main
